name: Bug
description: Reportar algo que no funciona
labels: ["status:triage", "type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Qué debería pasar
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: "1. Ir a ...\n2. Click en ...\n3. Ver error"
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Navegador / dispositivo
