name: "Agent: UX Designer"

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: agent-designer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  designer:
    if: >-
      vars.AGENTS_ENABLED == 'true' &&
      (github.event_name != 'issues' || github.event.label.name == 'status:needs-ux')
    uses: ./.github/workflows/_agent.yml
    secrets: inherit
    with:
      role: ux-designer
      model: ${{ vars.MODEL_DESIGNER || 'claude-sonnet-5-5' }}
      allowed_tools: "Bash(gh:*),Bash(git:*),Read,Write,Edit,Glob,Grep"
      task: >-
        ${{ github.event_name == 'issues'
          && format('Escribí la spec de UI del issue #{0} y movelo a status:needs-spec.', github.event.issue.number)
          || 'Procesá los issues en status:needs-ux (máx. 3). Si docs/design/ no existe, abrí primero una PR con el design system base.' }}
