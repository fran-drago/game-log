name: Issue guard

# Repo público: issues de personas externas no se procesan automáticamente
# (protege a los agentes de prompt injection). El Product Owner decide.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  guard:
    if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$NUMBER" --repo "$REPO" --add-label needs-human
          gh issue comment "$NUMBER" --repo "$REPO" --body "¡Gracias por el aporte! Un mantenedor lo va a revisar antes de que el equipo lo procese."
